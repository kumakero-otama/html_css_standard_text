<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>リストのサンプル</title>
    </head>
    <body>
        <h1>リストのサンプル</h1>
        <h3>番号のないリスト</h3>
        <ul>
            <li>項目1</li>
            <li>項目2</li>
        </ul>
        <hr>
        <h3>番号のあるリスト</h3>
        <ol>
            <li>項目A</li>
            <li>項目B</li>
        </ol>
        <hr>
    </body>
</html>
